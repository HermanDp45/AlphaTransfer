<text x="72" y="120" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#676767" text-anchor="start">Все 6 годовых ячеек: lift &gt; 1,30×; H5 держит редкую частоту в годовом guard-диапазоне</text>
