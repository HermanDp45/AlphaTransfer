<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Польза полной истории H3</title>
<desc id="desc">Сравнение H3 rank80 на 120 месяцах и полной истории с 2010 года.</desc>
<rect width="1600" height="900" fill="#FFFFFF"/>
<text x="72" y="78" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="700" fill="#171717" text-anchor="start">История с 2010 года закрыла провал H3 в 2026</text>
<text x="72" y="120" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#676767" text-anchor="start">Цена устойчивости: ниже lift в 2025 и немного реже коммуникации</text>
<rect x="70" y="165" width="1460" height="605" rx="24" fill="#FFFFFF" stroke="#D9D9D9" stroke-width="1"/>
<text x="105" y="230" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#171717" text-anchor="start">2024</text>
<text x="105" y="292" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#676767" text-anchor="start">120 месяцев</text>
<text x="340" y="292" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#EF3124" text-anchor="start">с 2010</text>
<text x="105" y="365" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#171717" text-anchor="start">1,547×</text>
<text x="340" y="365" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#EF3124" text-anchor="start">1,609×</text>
<text x="105" y="410" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#676767" text-anchor="start">lift</text>
<text x="105" y="495" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#171717" text-anchor="start">86,3%</text>
<text x="340" y="495" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#EF3124" text-anchor="start">80,4%</text>
<text x="105" y="535" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#676767" text-anchor="start">coverage</text>
<text x="105" y="620" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#171717" text-anchor="start">+56,7</text>
<text x="340" y="620" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#EF3124" text-anchor="start">+57,5</text>
<text x="105" y="660" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#676767" text-anchor="start">forward delta, б.п.</text>
<line x1="530" y1="220" x2="530" y2="700" stroke="#D9D9D9" stroke-width="2"/>
<text x="585" y="230" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#171717" text-anchor="start">2025</text>
<text x="585" y="292" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#676767" text-anchor="start">120 месяцев</text>
<text x="820" y="292" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#EF3124" text-anchor="start">с 2010</text>
<text x="585" y="365" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#171717" text-anchor="start">1,589×</text>
<text x="820" y="365" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#EF3124" text-anchor="start">1,452×</text>
<text x="585" y="410" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#676767" text-anchor="start">lift</text>
<text x="585" y="495" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#171717" text-anchor="start">92,2%</text>
<text x="820" y="495" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#EF3124" text-anchor="start">92,2%</text>
<text x="585" y="535" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#676767" text-anchor="start">coverage</text>
<text x="585" y="620" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#171717" text-anchor="start">+48,2</text>
<text x="820" y="620" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#EF3124" text-anchor="start">+40,3</text>
<text x="585" y="660" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#676767" text-anchor="start">forward delta, б.п.</text>
<line x1="1010" y1="220" x2="1010" y2="700" stroke="#D9D9D9" stroke-width="2"/>
<text x="1065" y="230" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#171717" text-anchor="start">2026</text>
<text x="1065" y="292" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#676767" text-anchor="start">120 месяцев</text>
<text x="1300" y="292" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#EF3124" text-anchor="start">с 2010</text>
<text x="1065" y="365" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#171717" text-anchor="start">1,235×</text>
<text x="1300" y="365" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#EF3124" text-anchor="start">1,441×</text>
<text x="1065" y="410" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#676767" text-anchor="start">lift</text>
<text x="1065" y="495" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#171717" text-anchor="start">97,0%</text>
<text x="1300" y="495" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#EF3124" text-anchor="start">84,8%</text>
<text x="1065" y="535" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#676767" text-anchor="start">coverage</text>
<text x="1065" y="620" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#171717" text-anchor="start">+36,5</text>
<text x="1300" y="620" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#EF3124" text-anchor="start">+73,8</text>
<text x="1065" y="660" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#676767" text-anchor="start">forward delta, б.п.</text>
<rect x="100" y="710" width="1400" height="45" rx="12" fill="#ECF7F0" stroke="none" stroke-width="1"/>
<text x="125" y="740" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1F8A55" text-anchor="start">Выбор сделан по прохождению годовых gates, а не по максимальному среднему lift.</text>
<text x="1530" y="875" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#676767" text-anchor="end">Парный bootstrap разницы включает ноль: статистически гарантированное превосходство над 120m не заявляется.</text>
</svg>
