[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alphatransfer-signal"
version = "0.2.0"
description = "Auditable RUB to KZT timing signal and walk-forward report"
requires-python = ">=3.11"

[project.scripts]
alphatransfer = "alphatransfer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
