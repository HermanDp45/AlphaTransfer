[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alphatransfer-signal"
version = "0.1.0"
description = "Reproducible no-look-ahead FX signal layer for transfer corridors"
requires-python = ">=3.10"

[project.scripts]
alphatransfer = "alphatransfer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
*** Add File: src/alphatransfer/__init__.py
"""Public, reproducible signal layer for RUB transfer corridors."""

