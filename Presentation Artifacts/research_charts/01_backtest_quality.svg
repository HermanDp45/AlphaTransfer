<rect width="1600" height="900" fill="#FFFFFF"/>
<text x="72" y="78" font-family="Arial, Helvetica, sans-serif" font-size="39" font-weight="700" fill="#171717" text-anchor="start" >Итог: lift 1,435× на 5 коридорах при цели кейса ≥ 1,30×</text>
<text x="72" y="120" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#676767" text-anchor="start" >Единый rolling OOT протокол · NOW_FAVORABLE · h=5 · 2023–2025 · 663 сигнала</text>
