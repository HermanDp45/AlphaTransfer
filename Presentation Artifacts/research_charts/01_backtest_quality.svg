<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Итоговый результат против бейзлайнов кейса</title>
<desc id="desc">Финальный lift сравнивается со случайным днём, ML на базовых FX-признаках кейса и целевым уровнем 1.3.</desc>
