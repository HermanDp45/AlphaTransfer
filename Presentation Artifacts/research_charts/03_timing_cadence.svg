<text x="645" y="682" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="start" >+31,8% к бейзлайну признаков кейса</text>
<text x="1240" y="682" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#FFFFFF" text-anchor="start" >Brier −12,8%</text>
