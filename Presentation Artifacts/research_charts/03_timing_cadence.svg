<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Что добавили поверх бейзлайна кейса</title>
<desc id="desc">Путь от официального курса и базовых индикаторов к расширенному набору источников, структурному рыночному фактору и строгой оценке.</desc>
<defs>
